<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ruleta</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-background: #FBF5F3;
        --color-primary: #E28413;
      }
    </style>
</head>

<body class="bg-background text-stone-800 flex flex-col min-h-screen">
    <header class="border-b border-stone-200 bg-white">
        <h1 class="max-w-5xl mx-auto px-6 py-4 text-xl font-bold text-primary">Mi Ruleta</h1>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full p-6 grid gap-6 md:grid-cols-2 items-start">

        <section id="panel-opciones" class="bg-white rounded-2xl border border-stone-200 p-6">
            <h2 class="text-lg font-bold">Opciones</h2>

            <form id="form-opciones" class="mt-4 flex gap-2">
                <input id="input-opcion" type="text" placeholder="Nueva opción"
                    class="flex-1 min-w-0 rounded-lg border border-stone-300 px-3 py-2 focus:outline-2 focus:outline-primary">
                <button type="submit" class="rounded-lg bg-primary px-4 py-2 font-semibold text-white hover:opacity-90">
                    Añadir
                </button>
            </form>

            <ul id="lista-opciones" class="mt-4 space-y-2">
            </ul>
        </section>
        <section id="panel-ruleta" class="bg-white rounded-2xl border border-stone-200 p-6 flex flex-col items-center">
            <h2 class="text-lg font-bold">Gira la Ruleta</h2>

            <div class="relative mt-6">
                <span class="absolute left-1/2 -top-4 -translate-x-1/2 text-3xl leading-none text-stone-800">▼</span>
                <canvas id="ruletaCanvas" width="400" height="400"
                    class="w-full max-w-sm rounded-full border-8 border-stone-800"
                    style="background: conic-gradient(#E28413 0 25%, #1F7A74 0 50%, #F2B84B 0 75%, #5B2A4E 0)"></canvas>
            </div>

            <button id="btn-girar" class="mt-6 rounded-full bg-primary px-10 py-3 text-lg font-bold text-white hover:opacity-90">
                ¡Girar!
            </button>
        </section>
    </main>

    <footer class="py-4 text-center text-sm text-stone-500">
        <p>&copy; 2026 Mi Ruleta - Todos los derechos reservados</p>
    </footer>
    <dialog id="modal-resultado" class="m-auto w-80 rounded-2xl p-6 text-center backdrop:bg-black/50">
        <p class="text-stone-500">La ruleta eligió</p>
        <p id="modal-texto" class="mt-1 text-3xl font-bold text-primary">Pizza</p>

        <form method="dialog" class="mt-6 flex flex-col gap-2">
            <button class="rounded-lg bg-primary py-2 font-semibold text-white hover:opacity-90">Cerrar</button>
            <button id="btn-eliminar" value="eliminar" class="rounded-lg border border-red-300 py-2 font-semibold text-red-600 hover:bg-red-50">
                Eliminar esta opción
            </button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
